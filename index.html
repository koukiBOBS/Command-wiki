<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 指令百科 | 指令与 ID 全能查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700;900&family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --mc-bg: #121212;
            --mc-panel: #242424;
            --mc-button: #7e7e7e;
            --mc-green: #388e3c;
            --mc-blue: #1976d2;
            --mc-border: #000000;
        }
        body {
            background-color: var(--mc-bg);
            color: #f0f0f0;
            font-family: 'Noto Sans SC', sans-serif;
            margin: 0;
            padding: 0;
            background-image: radial-gradient(circle at 2px 2px, rgba(255,255,255,0.02) 1px, transparent 0);
            background-size: 32px 32px;
        }
        .mc-font {
            font-family: 'VT323', monospace;
        }
        .mc-button {
            background-color: var(--mc-button);
            border-top: 3px solid #ccc;
            border-left: 3px solid #ccc;
            border-bottom: 3px solid #222;
            border-right: 3px solid #222;
            padding: 10px 18px;
            color: white;
            text-shadow: 2px 2px #000;
            transition: all 0.05s;
            box-shadow: 0 4px 0 #000;
            margin-bottom: 4px;
        }
        .mc-button:active {
            border-bottom: 3px solid #ccc;
            border-right: 3px solid #ccc;
            border-top: 3px solid #222;
            border-left: 3px solid #222;
            transform: translateY(4px);
            box-shadow: none;
            margin-bottom: 0;
        }
        .mc-button.active {
            background-color: var(--mc-green);
            border-top-color: #55a659;
            border-left-color: #55a659;
            border-bottom-color: #1b5e20;
            border-right-color: #1b5e20;
        }
        .mc-panel {
            background-color: var(--mc-panel);
            border: 4px solid #000;
            position: relative;
        }
        .mc-panel::after {
            content: "";
            position: absolute;
            inset: 0;
            border: 2px solid #444;
            pointer-events: none;
        }
        .command-card {
            background-color: #1a1a1a;
            border: 2px solid #2a2a2a;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #000;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: var(--mc-green);
        }
        code {
            font-family: 'VT323', monospace;
        }
        input, select, textarea {
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.5);
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>
</body>
</html>
